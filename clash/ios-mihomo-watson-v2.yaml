# ============================================================
# Watson · iOS Mihomo v2 稳定增强版
# 分组结构 1:1 复刻 kiki-rgb-00/kiki 的 JS/Whisper.js
# 规则 = 保留原始 RULE-SET 体系；针对 iOS Mihomo 分流进行兼容性调整
#
# 说明：
# - 地区 Auto 组用 filter 正则自动筛选节点，该地区有节点即自动填充
# - 服务组 select 类型，可选：All-Nodes / Global-Fallback / 各地区 Auto / PROXY-Gate / DIRECT
# ============================================================

# v2 (2026-11-05) 变更：修复故障转移错误引用；双地区严格策略；
# DNS/DoH 兼容优先；Apple Push 默认直连；OneDrive 优先；闲置测速 lazy。
# 原版 v1 保持在 clash/ios-mihomo-watson.yaml，未覆盖。
#
# 2026-11-04 v1 历史说明：
# 1. 原版备份：CLASH_原始备份_2026-11-04.yaml，未做任何改动。
# 2. 新增“🇺🇸🇸🇪 US-SE-Fallback”：美国优先、瑞典备用，最后使用原全球备用组兜底。
# 3. 为各服务 select 组增加上述组为第一默认选项；用户已有历史选项可能不会自动重置。
# 4. Apple、iCloud、Apple Push 的规则顺序优化；MicrosoftCN 由直连改为 Microsoft。
# 5. 移除一刀切 UDP/443、STUN/TURN、全局 IPv6 拒绝以及宽泛 OpenAI ASN 匹配。
# 6. 保留原有广告/DoH 规则；若应用受影响，建议优先查看连接日志定位命中规则。
# 7. 这是覆写/合并模板，不包含实际代理节点与 DNS/TUN 设置，不应直接当完整订阅使用。
# ============================================================

proxy-groups:
  # 严格双地区：不会退回其他国家；适合需要稳定出口地区的账户服务
  - name: 🇺🇸🇸🇪 US-SE-Strict
    type: fallback
    proxies:
      - 🇺🇸 US-Auto
      - 🇸🇪 SE-Auto
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true

  # ---- 美国优先，瑞典备用：测速只表示节点可达，不保证对应业务可访问 ----
  - name: 🇺🇸🇸🇪 US-SE-Fallback
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available_1.png
    proxies:
      - 🇺🇸 US-Auto
      - 🇸🇪 SE-Auto
      - 🌍 Global-Fallback
    url: https://www.gstatic.com/generate_204
    interval: 300

  # ---- 主策略组 ----

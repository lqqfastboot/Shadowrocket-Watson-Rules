rules:
  # ===== 局域网 / 私网 =====
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT

  # ===== 机场订阅 / 官网 =====
  - DOMAIN,thaibuy.cc,PROXY-Gate
  - DOMAIN,www.thaibuy.cc,PROXY-Gate
  - DOMAIN,ww2.thaibuy.cc,PROXY-Gate
  - DOMAIN,www.xiaobaituvpn.com,DIRECT
  - DOMAIN,vs8.thaibuy.cc,DIRECT
  - DOMAIN,ww8.thaibuy.cc,DIRECT
  - DOMAIN,ww.thaibuy.cc,DIRECT
  - DOMAIN,my.thaibuy.cc,DIRECT

  # ===== QUIC 443 阻断（非国内）=====

  # ===== 广告 / 隐私 =====
  # 不全局阻断第三方 DNS/DoH/DoT；如需防泄漏，应通过实际 DNS/TUN 设置与日志验证。
  # 保留广告域名集拦截，不将正常 DNS 请求误当广告。
  - RULE-SET,ads_domain,🛑 广告拦截

  # ===== STUN / TURN =====

  # ===== BT / PT =====
  - RULE-SET,bittorrent_domain,DIRECT
  - DST-PORT,6881-6999,DIRECT
  - DST-PORT,51413,DIRECT

  # ===== 邮件端口 =====
  - DST-PORT,25,DIRECT
  - DST-PORT,465,DIRECT
  - DST-PORT,587,DIRECT
  - DST-PORT,2525,DIRECT

  # ===== PikPak =====
  - DOMAIN,access.pikpakdrive.com,REJECT
  - DOMAIN,access.mypikpak.com,REJECT
  - DOMAIN,access.mypikpak.net,REJECT
  - DOMAIN,access.pikpak.me,REJECT
  - DOMAIN-KEYWORD,dl-a10b-,DIRECT
  - DOMAIN-KEYWORD,dl-z01a-,DIRECT
  - DOMAIN-REGEX,^dl-[A-Za-z0-9-]+\.mypikpak\.com$,DIRECT


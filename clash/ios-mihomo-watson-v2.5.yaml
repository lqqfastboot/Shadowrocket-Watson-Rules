# Watson Clash / Mihomo V2.5.1 — 分流规则 + 策略组优化（基于 v2.4，未覆盖原文件）
# 改动: 1) Global-Auto tolerance 10->50 防频繁跳节点  2) 删重复规则 googlevideo.com x1
#       3) IBKR 盈透: IBKR-US 策略组（坦帕优先 -> 全美备用，仅美国出口、无 DIRECT）+ 13 条域名
#       4) Meta 全家桶: Meta 策略组取消隐藏并精简选项，含 Facebook/Instagram/Threads/Messenger/Oculus/Meta AI，WhatsApp 默认跟随 Meta
#       5) 低频服务组 hidden:true，只留常用组在首页（同 v3 思路）
# 注意: 仍是覆写模板，不含节点/订阅/DNS/TUN；导入前备份，先在客户端验证规则集加载。
proxy-groups:
- name: 🇺🇸🇸🇪 US-SE-Strict
  type: fallback
  empty-fallback: REJECT
  proxies:
  - 🇺🇸 US-Auto
  - 🇸🇪 SE-Auto
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  expected-status: 204
  max-failed-times: 3
  lazy: true
- name: 🇺🇸🇸🇪 US-SE-Fallback
  type: fallback
  empty-fallback: REJECT
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available_1.png
  proxies:
  - 🇺🇸 US-Auto
  - 🇸🇪 SE-Auto
  - 🇻🇳 VN-Auto
  - 🌍 Global-Fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  expected-status: 204
  max-failed-times: 3
  lazy: true

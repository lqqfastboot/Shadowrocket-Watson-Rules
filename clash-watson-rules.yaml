# Watson Clash / Mihomo 轻量规则库 V2
# 面向支持 proxy-groups + rules 的 iOS Clash 客户端规则库。
# 不修改 DNS / TUN / 端口等客户端全局设置，不包含任何节点凭据。
# Apple / AI / Meta / PayPal / TikTok / X -> 美国坦帕优先、瑞典备用；YouTube / Google -> 越南优先、瑞典备用；其他海外 -> 越南优先、瑞典备用。

proxy-groups:
  - name: US-Tampa
    type: url-test
    include-all: true
    filter: '(?i)(佛罗里达州.*坦帕|Tampa|Florida.*Tampa)'
    url: https://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    lazy: true
    timeout: 5000
    max-failed-times: 3

  - name: Vietnam
    type: url-test
    include-all: true
    filter: '(?i)(越南胡志明|Vietnam.*HCM|Ho Chi Minh)'
    url: https://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    lazy: true
    timeout: 5000
    max-failed-times: 3

  - name: Sweden
    type: url-test
    include-all: true
    filter: '(?i)(瑞典|Sweden)'
    url: https://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    lazy: true
    timeout: 5000
    max-failed-times: 3

  - name: US-Fallback
    type: fallback
    proxies:
      - US-Tampa
      - Sweden
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: true
    timeout: 5000
    max-failed-times: 3

  - name: Apple-US
    type: fallback
    proxies:
      - US-Tampa
      - Sweden
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: true
    timeout: 5000
    max-failed-times: 3

  - name: OpenAI-US
    type: fallback
    proxies:
      - US-Tampa
      - Sweden
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: true
    timeout: 5000
    max-failed-times: 3

  - name: Overseas
    type: fallback
    proxies:
      - Vietnam
      - Sweden
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: true
    timeout: 5000
    max-failed-times: 3

  # X / Twitter 独立可选策略；默认保持美国坦帕优先、瑞典备用
  - name: X
    type: select
    proxies:
      - US-Fallback
      - US-Tampa
      - Sweden
      - Overseas
      - Vietnam
      - DIRECT

  # Meta 全家桶独立可选策略；默认保持美国坦帕优先、瑞典备用
  - name: Meta
    type: select
    proxies:
      - US-Fallback
      - US-Tampa
      - Sweden
      - Overseas
      - Vietnam
      - DIRECT

rules:
  # 局域网 / DLNA / UPnP / mDNS 优先直连
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT

  # WebRTC / STUN 防真实 IP 泄漏
  # 域名命中 STUN 时直接拒绝；端口规则仅限制 UDP，避免误伤 TCP/TURN 回退。
  - DOMAIN-KEYWORD,stun,REJECT
  - AND,((NETWORK,UDP),(DST-PORT,3478)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,19302)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,5349)),REJECT


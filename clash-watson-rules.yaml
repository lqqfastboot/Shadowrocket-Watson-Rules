# Watson Clash / Mihomo 轻量规则库 V2
# 面向支持 proxy-groups + rules 的 iOS Clash 客户端规则库。
# 不修改 DNS / TUN / 端口等客户端全局设置，不包含任何节点凭据。
# AI / TikTok / X -> 美国坦帕；YouTube / Google -> 越南；其他海外 -> 越南优先、瑞典备用。

proxy-groups:
  - name: US-Tampa
    type: url-test
    include-all: true
    filter: '(?i)(佛罗里达州.*坦帕|Tampa|Florida.*Tampa)'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  - name: Vietnam
    type: url-test
    include-all: true
    filter: '(?i)(越南胡志明|Vietnam.*HCM|Ho Chi Minh)'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  - name: Sweden
    type: url-test
    include-all: true
    filter: '(?i)(瑞典|Sweden)'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  - name: Overseas
    type: fallback
    proxies:
      - Vietnam
      - Sweden
    url: https://www.gstatic.com/generate_204
    interval: 600

rules:
  # 局域网 / DLNA / UPnP / mDNS 优先直连
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT

  # WebRTC / STUN 防真实 IP 泄漏
  # 直接拒绝常见 STUN 探测，防止浏览器通过 UDP 暴露本地公网出口。
  - DOMAIN-KEYWORD,stun,REJECT
  - DST-PORT,3478,REJECT
  - DST-PORT,19302,REJECT
  - DST-PORT,5349,REJECT

  # 王者荣耀 / 腾讯 / 微信 / QQ
  - GEOSITE,tencent,DIRECT

  # 支付宝 / 阿里系国内服务

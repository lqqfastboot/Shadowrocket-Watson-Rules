# Watson Mihomo / Clash Meta Rules
# 仅提供分流逻辑，不包含节点、UUID、密码或订阅 Token。
# 使用前请在客户端已有节点/订阅基础上加载本规则配置。
# AI / TikTok / X -> 美国坦帕；Google / YouTube -> 越南优先、瑞典备用；其他海外 -> 越南优先、瑞典备用。

mode: rule
log-level: info
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true

# DNS：国内解析优先；代理流量由 Mihomo 接管。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost.ptlogin2.qq.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# 本文件不保存任何节点凭据。
# include-all 会使用客户端当前已加载的全部节点，再通过名称正则筛选对应地区。
proxy-groups:
  - name: US-Tampa
    type: url-test
    include-all: true
    filter: '(?i)佛罗里达州.*坦帕'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  - name: Vietnam
    type: url-test
    include-all: true
    filter: '(?i)越南胡志明'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  - name: Sweden
    type: url-test
    include-all: true
    filter: '(?i)瑞典'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  - name: Overseas
    type: fallback
    proxies:
      - Vietnam
      - Sweden
    url: https://www.gstatic.com/generate_204
    interval: 600

rule-providers:
  HonorOfKings:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/lqqfastboot/Shadowrocket-Watson-Rules/main/rules/HonorOfKings.list

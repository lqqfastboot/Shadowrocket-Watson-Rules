    interval: 86400

  WeChat:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/WeChat/WeChat.list
    path: ./ruleset/watson-wechat.list
